services:
  db:
    # Official Postgres 16 image with the pgvector extension preinstalled.
    # Plain postgres:16-alpine cannot CREATE EXTENSION vector.
    image: pgvector/pgvector:pg16
    container_name: devdocs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devdocs}
      POSTGRES_USER: ${POSTGRES_USER:-devdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-devdocs} -d ${POSTGRES_DB:-devdocs}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
